server:
  port: ${CATALOG_SERVICE_PORT:8082}

spring:
  application:
    name: catalog-service

  cloud:
    openfeign:
      client:
        config:
          user-service:
            connect-timeout: ${USER_SERVICE_CONNECT_TIMEOUT_MS:1000}
            read-timeout: ${USER_SERVICE_READ_TIMEOUT_MS:2000}
            url: ${USER_SERVICE_URL:}
          order-service:
            connect-timeout: ${ORDER_SERVICE_CONNECT_TIMEOUT_MS:1000}
            read-timeout: ${ORDER_SERVICE_READ_TIMEOUT_MS:2000}
            url: ${ORDER_SERVICE_URL:}

  # ?replicaSet=rs0 obbligatorio: senza, il driver tratta il nodo come
  # standalone e le transazioni dell'outbox falliscono silenziosamente
  # (infra/docker-compose.yml, §2b).
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/catalog_db?replicaSet=rs0}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mvc:
    problemdetails:
      enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rebyte}
    password: ${RABBITMQ_PASSWORD}
    # simple: il relay chiama waitForConfirms(timeout) una volta per batch e
    # marca pubblicato solo su ritorno pulito — stessa scelta di user-service.
    publisher-confirm-type: simple

# /internal/** e deliberatamente non autenticato (docs/architecture.md §7c) e
# non instradabile dal gateway — ma springdoc non lo sa, quindi senza questa
# esclusione l'API interna finirebbe comunque nello spec pubblico. Il
# pacchetto it.rebyte.catalog.controller.internal non esiste ancora in
# questo piano (02-03 lo crea): l'esclusione e dichiarata ora cosi
# quell'application.yml non va riaperto.
springdoc:
  packages-to-exclude: it.rebyte.catalog.controller.internal
  paths-to-exclude: /internal/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

rebyte:
  media:
    bucket: ${MEDIA_BUCKET}
    region: ${MEDIA_REGION:${AWS_REGION:eu-south-1}}
    distribution-domain: ${MEDIA_DISTRIBUTION_DOMAIN}
    listings-prefix: ${MEDIA_LISTINGS_PREFIX:listings/}
    software-prefix: ${MEDIA_SOFTWARE_PREFIX:software/}
    upload:
      max-size-bytes: ${MEDIA_PHOTO_MAX_SIZE_BYTES:2097152}
      policy-expiry-seconds: 300
      artifact-max-size-bytes: ${MEDIA_ARTIFACT_MAX_SIZE_BYTES:104857600}
    download:
      url-ttl-seconds: ${MEDIA_DOWNLOAD_URL_TTL_SECONDS:120}

  catalog:
    default-categories:
      enabled: ${CATALOG_DEFAULT_CATEGORIES_ENABLED:true}
    price:
      scale: ${CATALOG_PRICE_SCALE:2}
    listing-detail-cache:
      key-prefix: "rebyte:catalog:listing-detail:"
      ttl: 60
    category-tree:
      # Chiave unica per l'INTERO albero (struttura + definizioni di
      # attributo, MAI listingCount) — un blob solo, non una voce per nodo
      # (02-RESEARCH.md, Don't Hand-Roll: "Category-tree traversal caching").
      key: rebyte:catalog:category-tree
      # TTL lungo in secondi: l'albero cambia quasi mai, e ogni scrittura di
      # categoria/attributo invalida esplicitamente questa chiave comunque
      # (CategoryService#create, AttributeDefinitionService#define /
      # #retireAllowedValue) — il TTL e solo una rete di sicurezza contro un
      # eviction perso, non il meccanismo primario di freschezza.
      ttl: 3600

  search:
    url: ${MEILI_URL:http://localhost:7700}
    # Nessun default: un deployment senza chiave deve rifiutarsi di partire
    # invece di parlare con un indice non autenticato.
    master-key: ${MEILI_MASTER_KEY}
    # true ovunque tranne nei test *IT che non hanno un container Meilisearch
    # reale (MongoTestBase la forza a false) — ListingIndexSettings fa una
    # vera chiamata di rete all'avvio, e senza questo gate un contesto senza
    # container avrebbe altrimenti parlato con l'istanza locale dell'utente.
    bootstrap-enabled: true
    page:
      default-size: 20
      maximum-size: 100
    rebuild:
      batch-size: 250
    drift:
      fixed-delay-ms: 300000
      initial-delay-ms: 300000

  outbox:
    relay:
      # fixedDelay (mai fixedRate), misurato dal completamento del tick
      # precedente — stessa scelta di user-service.
      fixed-delay-ms: 1000
      batch-size: 100
      max-batches-per-tick: 50
      confirm-timeout-ms: 5000
      lag-threshold-seconds: 60
      # Senza equivalente in user-service: la claim Mongo (findAndModify) e
      # una scrittura committata, non un lock di sessione — il reaper libera
      # una claim abbandonata dopo questa finestra (02-RESEARCH.md Pitfall 3).
      lease-seconds: 60
    reaper:
      # Comodamente piu lungo del lease, cosi una claim di un relay vivo non
      # viene mai rubata mentre sta ancora lavorando il batch.
      fixed-delay-ms: 120000
    purge:
      retention-days: 7
      cron: "0 0 3 * * *"
