server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /config.demo.json {
        return 404;
    }

    location = /notifications/email-preferences/unsubscribe {
        if ($request_method !~ ^(GET|POST)$) { return 405; }
        proxy_pass https://api.rebyte.tech;
        proxy_set_header Host api.rebyte.tech;
        proxy_ssl_server_name on;
        proxy_ssl_name api.rebyte.tech;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 2;
        proxy_redirect off;
        access_log off;
        # Upstream TLS errors otherwise include the signed query in the error log.
        error_log /dev/null;
    }

    location ~ "^/[A-Za-z0-9_-]+-[A-Za-z0-9_-]{8}\.(js|mjs|css|woff2)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|mjs|css|json|map|png|jpg|jpeg|webp|avif|svg|ico|woff|woff2|ttf|txt|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /media/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
