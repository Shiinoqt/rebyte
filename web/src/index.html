<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>rebyte</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- No robots.txt on purpose: a Disallow rule would stop crawlers from fetching the page and reading this tag. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>try { if (localStorage.getItem('rebyte.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; if (localStorage.getItem('rebyte.reducedMotion') === 'true') document.documentElement.setAttribute('data-reduced-motion', ''); } catch {}</script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
