          "max-size": "10m",
          "max-file": "3"
        }
      },
      "depends_on": {
        "discovery-server": {
          "condition": "service_healthy"
        },
        "rabbitmq": {
          "condition": "service_healthy"
        },
        "mysql-app": {
          "condition": "service_healthy"
        }
      },
      "hostname": "user-service",
      "environment": {
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=35 -XX:+UseSerialGC -Xss512k -XX:ReservedCodeCacheSize=64m",
        "SPRING_PROFILES_ACTIVE": "cognito,demo",
        "EUREKA_INSTANCE_HOSTNAME": "user-service",
        "EUREKA_INSTANCE_PREFER_IP_ADDRESS": "false",
        "AWS_REGION": "${AWS_REGION:?Set AWS_REGION}",
        "COGNITO_USER_POOL_ID": "${COGNITO_USER_POOL_ID:?Set COGNITO_USER_POOL_ID}",
        "EUREKA_URL": "http://discovery-server:8761/eureka/",
        "RABBITMQ_HOST": "rabbitmq",
        "RABBITMQ_USER": "${RABBITMQ_USER:?Set RABBITMQ_USER}",
        "RABBITMQ_PASSWORD": "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}",
        "SPRING_DATASOURCE_URL": "jdbc:mysql://mysql-app:3306/user_demo",
        "MYSQL_USER": "rebyte",
        "MYSQL_PASSWORD": "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}",
        "MEDIA_BUCKET": "${MEDIA_BUCKET:?Set MEDIA_BUCKET}",
        "MEDIA_REGION": "${AWS_REGION:?Set AWS_REGION}",
        "AWS_ACCESS_KEY_ID": "${USER_AWS_ACCESS_KEY_ID:?Set USER_AWS_ACCESS_KEY_ID}",
        "AWS_SECRET_ACCESS_KEY": "${USER_AWS_SECRET_ACCESS_KEY:?Set USER_AWS_SECRET_ACCESS_KEY}",
        "MEDIA_DISTRIBUTION_DOMAIN": "${MEDIA_DISTRIBUTION_DOMAIN:?Set MEDIA_DISTRIBUTION_DOMAIN}",
        "MEDIA_AVATAR_MAX_SIZE_BYTES": "262144"
      },
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8081/actuator/health"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "90s"
      }
    },
    "catalog-service": {
