        "GATEWAY_PORT": "8080",
        "GATEWAY_CORS_ALLOWED_ORIGINS": "${SPA_ALLOWED_ORIGINS:?Set SPA_ALLOWED_ORIGINS}",
        "GATEWAY_TRUSTED_PROXIES": "${GATEWAY_TRUSTED_PROXIES:?Set GATEWAY_TRUSTED_PROXIES}",
        "SERVER_FORWARD_HEADERS_STRATEGY": "framework",
        "SPRING_DATA_REDIS_TIMEOUT": "2s",
        "SPRING_DATA_REDIS_CONNECT_TIMEOUT": "2s"
      },
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8080/actuator/health"
        ],
        "interval": "15s",
