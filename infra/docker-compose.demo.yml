    "api-gateway": {
      "image": "${GHCR_NAMESPACE:?Set GHCR_NAMESPACE}/api-gateway:${DEMO_IMAGE_TAG:?Set DEMO_IMAGE_TAG}",
      "platform": "linux/amd64",
      "restart": "unless-stopped",
