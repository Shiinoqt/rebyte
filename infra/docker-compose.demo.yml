        "retries": 12,
        "start_period": "90s"
      },
      "labels": [
        "traefik.enable=true",
        "traefik.docker.network=${COOLIFY_PROXY_NETWORK:?Set COOLIFY_PROXY_NETWORK}",
        "traefik.http.routers.rebyte-demo-api.rule=Host(`api.rebyte.tech`)",
        "traefik.http.routers.rebyte-demo-api.entrypoints=https",
        "traefik.http.routers.rebyte-demo-api.tls=true",
        "traefik.http.routers.rebyte-demo-api.tls.certresolver=letsencrypt",
        "traefik.http.routers.rebyte-demo-api.service=rebyte-demo-api",
        "traefik.http.services.rebyte-demo-api.loadbalancer.server.port=8080"
      ]
    },
    "demo-runner": {
      "image": "${GHCR_NAMESPACE:?Set GHCR_NAMESPACE}/demo-runner:${DEMO_IMAGE_TAG:?Set DEMO_IMAGE_TAG}",
      "platform": "linux/amd64",
      "restart": "unless-stopped",
      "init": true,
      "user": "10001:10001",
      "mem_limit": "768m",
      "cpus": "0.50",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "networks": [
        "backend"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "Europe/Rome"
      },
      "volumes": [
        {
          "type": "volume",
          "source": "reset-config",
          "target": "/run/secrets/demo-reset",
          "read_only": true,
          "volume": {
            "nocopy": true
          }
        }
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=64m,mode=1777",
        "/run/demo-reset:rw,noexec,nosuid,size=1m,uid=10001,gid=10001,mode=0700"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "/app/scripts/demo/runner.mjs",
          "--check"
        ],
        "interval": "30s",
        "timeout": "15s",
        "start_period": "30s",
        "retries": 3
      }
    }
  },
  "networks": {
    "backend": {
      "external": true,
      "name": "${DEMO_RESOURCE_ID:?Set DEMO_RESOURCE_ID}-backend"
    },
    "proxy": {
      "external": true,
      "name": "${COOLIFY_PROXY_NETWORK:?Set COOLIFY_PROXY_NETWORK}"
    }
  },
  "volumes": {
    "reset-config": {
      "external": true,
      "name": "${DEMO_RESOURCE_ID}-reset-config"
    },
    "mysql-data": {
      "name": "${DEMO_RESOURCE_ID:?Set DEMO_RESOURCE_ID}-mysql-data"
    },
    "redis-data": {
      "name": "${DEMO_RESOURCE_ID:?Set DEMO_RESOURCE_ID}-redis-data"
    },
    "rabbitmq-data": {
      "name": "${DEMO_RESOURCE_ID:?Set DEMO_RESOURCE_ID}-rabbitmq-data"
    },
    "meili-data": {
      "name": "${DEMO_RESOURCE_ID:?Set DEMO_RESOURCE_ID}-meili-data"
    }
  },
  "configs": {
    "mysql-init": {
      "content": "CREATE DATABASE IF NOT EXISTS user_demo CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\nGRANT ALL PRIVILEGES ON user_demo.* TO 'rebyte'@'%';\nCREATE DATABASE IF NOT EXISTS order_demo CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\nGRANT ALL PRIVILEGES ON order_demo.* TO 'rebyte'@'%';\nCREATE DATABASE IF NOT EXISTS payment_demo CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\nGRANT ALL PRIVILEGES ON payment_demo.* TO 'rebyte'@'%';\nFLUSH PRIVILEGES;\n"
    }
  }
}
