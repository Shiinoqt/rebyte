        "SPRING_DATASOURCE_URL": "jdbc:mysql://mysql-app:3306/order_demo",
        "MYSQL_USER": "rebyte",
        "MYSQL_PASSWORD": "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
      },
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8084/actuator/health"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "90s"
      }
    },
