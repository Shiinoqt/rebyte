{
  "services": {
    "mysql-app": {
      "image": "mysql:8.4",
      "platform": "linux/amd64",
      "restart": "unless-stopped",
      "mem_limit": "768m",
      "networks": [
        "backend"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "MYSQL_ROOT_PASSWORD": "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}",
        "MYSQL_USER": "rebyte",
        "MYSQL_PASSWORD": "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
      },
      "command": [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--innodb-buffer-pool-size=256M",
        "--max-connections=100"
      ],
      "volumes": [
        "mysql-data:/var/lib/mysql"
      ],
      "configs": [
        {
          "source": "mysql-init",
          "target": "/docker-entrypoint-initdb.d/01-demo.sql"
        }
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "40s"
      }
    },
    "redis": {
      "image": "redis:7-alpine",
      "user": "redis",
      "platform": "linux/amd64",
      "restart": "unless-stopped",
      "mem_limit": "256m",
      "networks": [
        "backend"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "REDIS_PASSWORD": "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      },
      "command": [
        "sh",
        "-ec",
        "exec redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""
      ],
      "volumes": [
        "redis-data:/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "10s"
      }
    },
    "rabbitmq": {
      "image": "${GHCR_NAMESPACE:?Set GHCR_NAMESPACE}/rabbitmq:${DEMO_IMAGE_TAG:?Set DEMO_IMAGE_TAG}",
      "platform": "linux/amd64",
      "restart": "unless-stopped",
      "mem_limit": "512m",
      "networks": [
        "backend"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "hostname": "rabbitmq",
      "environment": {
        "RABBITMQ_DEFAULT_USER": "${RABBITMQ_USER:?Set RABBITMQ_USER}",
        "RABBITMQ_DEFAULT_PASS": "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}"
      },
      "volumes": [
        "rabbitmq-data:/var/lib/rabbitmq"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "check_running"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "60s"
      }
    },
    "meilisearch": {
      "image": "getmeili/meilisearch:v1.53.2",
      "platform": "linux/amd64",
      "restart": "unless-stopped",
      "mem_limit": "512m",
      "networks": [
        "backend"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "MEILI_MASTER_KEY": "${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY}",
        "MEILI_ENV": "production",
        "MEILI_MAX_INDEXING_MEMORY": "256Mb",
        "MEILI_MAX_INDEXING_THREADS": "1"
      },
      "volumes": [
        "meili-data:/meili_data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:7700/health"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "20s"
      }
    },
    "discovery-server": {
      "image": "${GHCR_NAMESPACE:?Set GHCR_NAMESPACE}/discovery-server:${DEMO_IMAGE_TAG:?Set DEMO_IMAGE_TAG}",
      "platform": "linux/amd64",
      "restart": "unless-stopped",
      "mem_limit": "512m",
      "networks": [
        "backend"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "hostname": "discovery-server",
      "environment": {
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=35 -XX:+UseSerialGC -Xss512k -XX:ReservedCodeCacheSize=64m",
        "SPRING_PROFILES_ACTIVE": "cognito,demo",
        "EUREKA_INSTANCE_HOSTNAME": "discovery-server",
        "EUREKA_INSTANCE_PREFER_IP_ADDRESS": "false",
        "DISCOVERY_PORT": "8761"
      },
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8761/actuator/health"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "90s"
      }
    },
    "user-service": {
      "image": "${GHCR_NAMESPACE:?Set GHCR_NAMESPACE}/user-service:${DEMO_IMAGE_TAG:?Set DEMO_IMAGE_TAG}",
      "platform": "linux/amd64",
      "restart": "unless-stopped",
      "mem_limit": "512m",
      "networks": [
        "backend"
      ],
      "logging": {
        "driver": "json-file",
