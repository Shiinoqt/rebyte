        "redis": {
          "condition": "service_healthy"
        },
        "meilisearch": {
          "condition": "service_healthy"
        }
      },
      "hostname": "catalog-service",
      "environment": {
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=35 -XX:+UseSerialGC -Xss512k -XX:ReservedCodeCacheSize=64m",
        "SPRING_PROFILES_ACTIVE": "cognito,demo",
        "EUREKA_INSTANCE_HOSTNAME": "catalog-service",
        "EUREKA_INSTANCE_PREFER_IP_ADDRESS": "false",
        "AWS_REGION": "${AWS_REGION:?Set AWS_REGION}",
        "COGNITO_USER_POOL_ID": "${COGNITO_USER_POOL_ID:?Set COGNITO_USER_POOL_ID}",
        "EUREKA_URL": "http://discovery-server:8761/eureka/",
        "RABBITMQ_HOST": "rabbitmq",
        "RABBITMQ_USER": "${RABBITMQ_USER:?Set RABBITMQ_USER}",
        "RABBITMQ_PASSWORD": "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}",
        "MONGO_URI": "${CATALOG_MONGO_URI:?Set CATALOG_MONGO_URI}",
        "REDIS_HOST": "redis",
        "SPRING_DATA_REDIS_PASSWORD": "${REDIS_PASSWORD:?Set REDIS_PASSWORD}",
        "MEDIA_BUCKET": "${MEDIA_BUCKET:?Set MEDIA_BUCKET}",
        "MEDIA_REGION": "${AWS_REGION:?Set AWS_REGION}",
        "CATALOG_AWS_ACCESS_KEY_ID": "${CATALOG_AWS_ACCESS_KEY_ID:?Set CATALOG_AWS_ACCESS_KEY_ID}",
        "CATALOG_AWS_SECRET_ACCESS_KEY": "${CATALOG_AWS_SECRET_ACCESS_KEY:?Set CATALOG_AWS_SECRET_ACCESS_KEY}",
        "MEDIA_DISTRIBUTION_DOMAIN": "${MEDIA_DISTRIBUTION_DOMAIN:?Set MEDIA_DISTRIBUTION_DOMAIN}",
        "MEDIA_PHOTO_MAX_SIZE_BYTES": "1048576",
        "MEDIA_ARTIFACT_MAX_SIZE_BYTES": "10485760",
        "MEILI_URL": "http://meilisearch:7700",
        "MEILI_MASTER_KEY": "${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY}",
        "SPRING_DATA_REDIS_TIMEOUT": "2s",
        "SPRING_DATA_REDIS_CONNECT_TIMEOUT": "2s"
      },
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8082/actuator/health"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "90s"
      }
    },
    "order-service": {
