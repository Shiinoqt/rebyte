{
  "name": "Demo images",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths-ignore": [
        ".planning/**",
        "docs/**",
        "*.md",
        "**/*.md"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "demo-image-release",
    "cancel-in-progress": false
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad",
          "with": {
            "distribution": "temurin",
            "java-version": "26",
            "cache": "maven"
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.21.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Use the repository npm version",
          "run": "npm install --global npm@12.2.0"
        },
        {
          "name": "Install locked frontend dependencies",
          "run": "npm --prefix web ci"
        },
        {
          "name": "Build the RabbitMQ test fixture image",
          "run": "docker build --tag rebyte/rabbitmq:4.1-delayed infra/rabbitmq"
        },

        {
          "name": "Test demo tooling guards",
          "run": "node --test scripts/demo/*.test.mjs"
        },
        {
          "name": "Check release policy",
          "run": "node scripts/demo/check-release.mjs"
        },
        {
          "name": "Verify the complete Java reactor once",
          "run": "./mvnw -B verify"
        },
        {
          "name": "Test the frontend",
          "run": "npm --prefix web run test:ci"
        },
        {
          "name": "Compile the frontend once",
          "run": "npm --prefix web run build"
        },
        {
          "name": "Verify the actual SPA image and TLS boundary",
          "run": "node web/scripts/demo-image-smoke.mjs"
        },
        {
          "name": "Stage only verified runtime artifacts",
          "run": "node scripts/demo/check-release.mjs prepare release-contexts"
        },
        {
          "name": "Prove the final private runner with native tools",
          "run": "node scripts/demo/runner-image-smoke.mjs"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "demo-contexts",
            "path": "release-contexts",
            "if-no-files-found": "error",
            "retention-days": 3,
            "compression-level": 0
          }
        }
      ]
    },
    "publish": {
      "needs": "build",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "read",
        "packages": "write"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.21.0",
            "package-manager-cache": false
          }
        },
        {
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "demo-contexts",
            "path": "release-contexts"
          }
        },
        {
          "uses": "docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069"
        },
        {
          "uses": "docker/login-action@dbcb813823bdd20940b903addbd779551569679f",
          "with": {
            "registry": "ghcr.io",
            "username": "${{ github.actor }}",
            "password": "${{ secrets.GITHUB_TOKEN }}"
          }
        },
        {
          "name": "Publish the complete SHA release, then promote demo tags",
          "run": "node scripts/demo/check-release.mjs publish release-contexts"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "demo-release-manifest",
            "path": "release-manifest.json",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
